# Render Blueprint: free web service running the PRIDA game server (it also serves the built client).
# Dashboard → New → Blueprint → pick this repository. The game is then at https://<service>.onrender.com
services:
  - type: web
    name: prida
    runtime: node
    plan: free
    # Frankfurt: lowest ping for Europe and Russia (the default region is in the USA).
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run verify:release && npm run build
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PRIDA_MAX_ROOMS
        value: "6"
      # Accounts (0.23). Without these the server keeps accounts in a file that a free service loses on every
      # restart and deploy. A free Upstash Redis database (upstash.com, no card) keeps them: create one, open its
      # REST API tab and paste the two values in the Render dashboard (Environment). Never commit them here.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
