name: Motion and VFX 0.42 assets
on:
  push:
    branches: [assets/motion-vfx-042]
    paths: [.github/workflows/motion-vfx-042-assets.yml]
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Download author-published CC0 archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 2 --max-time 90 https://opengameart.org/sites/default/files/universal_animation_librarystandard.zip -o assets/quaternius.zip
          curl --fail --location --retry 2 --max-time 90 https://opengameart.org/sites/default/files/kenney_particlePack.zip -o assets/kenney.zip
          python3 - <<'PY'
          import pathlib,zipfile,hashlib,json
          report={}
          for f in pathlib.Path('assets').glob('*.zip'):
              with zipfile.ZipFile(f) as z:
                  assert z.testzip() is None
                  report[f.name]={'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'files':z.namelist()}
          pathlib.Path('assets/manifest.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prida-motion-vfx-042
          path: assets/
          retention-days: 5
          if-no-files-found: error
