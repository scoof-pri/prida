name: Frontier QA materials
on:
  push:
    branches: [feature/complete-frontier-040]
    paths: [.github/workflows/frontier-qa-materials.yml]
permissions:
  contents: read
jobs:
  materials:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install locked dependencies and verify the existing baseline
        run: |
          npm ci --ignore-scripts
          node prida-build-recovery.mjs
          node prida-update.mjs
      - name: Package public test inputs only
        run: |
          tar -czf frontier-qa-materials.tgz node_modules src scripts tests public package.json package-lock.json server.mjs accounts.mjs index.html vite.config.js Dockerfile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontier-qa-materials
          path: frontier-qa-materials.tgz
          retention-days: 3
